# ============================================================================
# Configuration Nginx pour BatiSaaS - Production
# ============================================================================
# Ce fichier contient la configuration optimisée pour Nginx en production
# Placez ce fichier dans: /etc/nginx/sites-available/batisaas
# Puis créez un lien: sudo ln -s /etc/nginx/sites-available/batisaas /etc/nginx/sites-enabled/
# ============================================================================

# Configuration upstream PHP-FPM
upstream php_fpm {
    server unix:/var/run/php/php8.2-fpm.sock;
    # Ou si vous utilisez TCP:
    # server 127.0.0.1:9000;
}

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name batisaas.com www.batisaas.com;

    # Redirection vers HTTPS
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name batisaas.com www.batisaas.com;

    # Root directory
    root /var/www/batisaas/public;
    index index.php index.html;

    # SSL Certificates (Let's Encrypt recommandé)
    ssl_certificate /etc/letsencrypt/live/batisaas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/batisaas.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/batisaas.com/chain.pem;

    # SSL Configuration moderne et sécurisée
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Logs
    access_log /var/log/nginx/batisaas_access.log;
    error_log /var/log/nginx/batisaas_error.log warn;

    # Limite de taille des uploads
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    gzip_disable "msie6";

    # Cache pour les fichiers statiques
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # Cache pour les uploads
    location ~* ^/uploads/.*\.(jpg|jpeg|png|gif|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Bloquer l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\.(env|git|htaccess|htpasswd|bak|config|sql|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquer l'accès aux dossiers sensibles
    location ~ ^/(config|storage|database|scripts|vendor|node_modules)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint
    location /health {
        try_files $uri $uri/ /health.php?$query_string;
    }

    # Service Worker PWA
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Manifest PWA
    location = /manifest.json {
        add_header Cache-Control "max-age=3600";
        try_files $uri =404;
    }

    # PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI optimizations
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # FastCGI Cache (optionnel)
        # fastcgi_cache batisaas_cache;
        # fastcgi_cache_valid 200 60m;
        # fastcgi_cache_bypass $skip_cache;
        # fastcgi_no_cache $skip_cache;
    }

    # Routing principal - Tout passe par index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API endpoints
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;

        # Rate limiting pour l'API
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # CORS headers pour l'API
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    }

    # Server-Sent Events (SSE) pour les notifications
    location /sse/ {
        try_files $uri $uri/ /index.php?$query_string;

        # Configuration SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Headers SSE
        add_header Cache-Control 'no-cache';
        add_header X-Accel-Buffering 'no';
        add_header Content-Type 'text/event-stream';
    }

    # Installation (à supprimer en production)
    location = /install.php {
        # Décommenter pour bloquer l'accès en production
        # deny all;
        try_files $uri =404;
        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}

# Configuration du cache FastCGI (optionnel mais recommandé)
# À placer dans le bloc http {} de nginx.conf principal
#
# fastcgi_cache_path /var/cache/nginx/batisaas levels=1:2 keys_zone=batisaas_cache:100m inactive=60m;
# fastcgi_cache_key "$scheme$request_method$host$request_uri";
#
