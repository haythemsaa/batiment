# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
# limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/s;

# ============================================================================
# Instructions d'installation
# ============================================================================
#
# 1. Installer les certificats SSL avec Let's Encrypt:
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d batisaas.com -d www.batisaas.com
#
# 2. Copier cette configuration:
#    sudo cp config/nginx.conf /etc/nginx/sites-available/batisaas
#
# 3. Activer le site:
#    sudo ln -s /etc/nginx/sites-available/batisaas /etc/nginx/sites-enabled/
#
# 4. Tester la configuration:
#    sudo nginx -t
#
# 5. Recharger Nginx:
#    sudo systemctl reload nginx
#
# 6. Configurer le renouvellement automatique SSL:
#    sudo certbot renew --dry-run
#
# ============================================================================
